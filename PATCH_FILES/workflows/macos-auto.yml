name: Build macOS DMG automatico

on:
  push:
    branches: [main, master]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-auto.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trova DMG sorgente
        id: source
        shell: bash
        run: |
          set -euo pipefail
          file="$(find macos/input -maxdepth 1 -type f -iname '*.dmg' | head -n 1 || true)"
          if [[ -z "$file" ]]; then
            echo 'Manca un file .dmg dentro macos/input/'
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Importa certificato Apple Developer ID
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" || -z "${CERT_PASSWORD:-}" ]]; then
            echo 'Per un DMG distribuibile serve il certificato Developer ID nei secrets GitHub.'
            echo 'Configura MACOS_CERTIFICATE_P12 e MACOS_CERTIFICATE_PASSWORD.'
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/cvplus-signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Estrai, verifica arm64, firma e ricrea DMG
        shell: bash
        env:
          SOURCE_DMG: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          chmod +x macos/scripts/rebuild_signed_dmg.sh
          mkdir -p macos/output
          macos/scripts/rebuild_signed_dmg.sh "$SOURCE_DMG" "macos/output/CVPlus-Compilatore-Alunno-macOS-AppleSilicon.dmg" "$IDENTITY"

      - name: Notarizza e applica staple
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo 'Configura APPLE_ID, APPLE_APP_PASSWORD e APPLE_TEAM_ID.'
            exit 1
          fi
          DMG='macos/output/CVPlus-Compilatore-Alunno-macOS-AppleSilicon.dmg'
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Prepara cartella MacOS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-macos
          mkdir -p release-macos/MacOS
          cp macos/output/CVPlus-Compilatore-Alunno-macOS-AppleSilicon.dmg release-macos/MacOS/
          ditto -c -k --sequesterRsrc --keepParent release-macos/MacOS release-macos/CVPlus-macOS.zip

      - name: Carica artifact macOS
        uses: actions/upload-artifact@v4
        with:
          name: CVPlus-macOS
          path: |
            release-macos/MacOS/CVPlus-Compilatore-Alunno-macOS-AppleSilicon.dmg
            release-macos/CVPlus-macOS.zip
          if-no-files-found: error

      - name: Aggiorna release stabile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='cvplus-latest'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title 'CV+ Compilatore Alunno - Windows e macOS' --notes 'Release stabile aggiornata automaticamente.'
          fi
          gh release upload "$tag" release-macos/MacOS/CVPlus-Compilatore-Alunno-macOS-AppleSilicon.dmg release-macos/CVPlus-macOS.zip --clobber
