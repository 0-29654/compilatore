name: Build Compilatore Alunni Release

on:
  push:
    branches: [ main, master, sviluppo ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Calcola automaticamente la prossima versione pubblica
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$project = Get-Content '.\CppStudentClient.csproj' -Raw
          $fallback = [string]($project.Project.PropertyGroup | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($fallback) -or $fallback -notmatch '^\d+\.\d+\.\d+$') {
            $fallback = '1.9.21'
          }
          $base = [version]$fallback

          # Raccoglie sia Releases sia tag Git. Se una build precedente ha creato il tag
          # ma non la Release, non riutilizziamo mai lo stesso numero.
          $versions = New-Object System.Collections.Generic.List[version]
          $versions.Add($base)

          try {
            $releaseJson = gh api "repos/${{ github.repository }}/releases?per_page=100" 2>$null
            if ($LASTEXITCODE -eq 0 -and $releaseJson) {
              foreach ($r in ($releaseJson | ConvertFrom-Json)) {
                if ([string]$r.tag_name -match '(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)') {
                  $versions.Add([version]"$($Matches[1]).$($Matches[2]).$($Matches[3])")
                }
              }
            }
          } catch { Write-Host "Lettura Releases non disponibile: $($_.Exception.Message)" }

          try {
            foreach ($t in (git tag --list)) {
              if ([string]$t -match '(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)') {
                $versions.Add([version]"$($Matches[1]).$($Matches[2]).$($Matches[3])")
              }
            }
          } catch { Write-Host "Lettura tag Git non disponibile: $($_.Exception.Message)" }

          $highest = $versions | Sort-Object -Descending | Select-Object -First 1

          # La versione del progetto rappresenta la versione minima richiesta da questo commit.
          # Se GitHub ha già una versione uguale o superiore, genera SEMPRE la successiva.
          # Così ogni nuova build pubblicata può essere rilevata dai client già installati.
          if ($highest -ge $base) {
            $publicVersions = New-Object System.Collections.Generic.List[version]
            try {
              $releaseJson2 = gh api "repos/${{ github.repository }}/releases?per_page=100" 2>$null
              if ($LASTEXITCODE -eq 0 -and $releaseJson2) {
                foreach ($r in ($releaseJson2 | ConvertFrom-Json)) {
                  if ([string]$r.tag_name -match '(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)') {
                    $publicVersions.Add([version]"$($Matches[1]).$($Matches[2]).$($Matches[3])")
                  }
                }
              }
            } catch {}
            $publicHighest = $publicVersions | Sort-Object -Descending | Select-Object -First 1
            if ($null -ne $publicHighest -and $publicHighest -ge $base) {
              $version = "$($publicHighest.Major).$($publicHighest.Minor).$($publicHighest.Build + 1)"
            } else {
              $version = "$($base.Major).$($base.Minor).$($base.Build)"
            }
          } else {
            $version = "$($base.Major).$($base.Minor).$($base.Build)"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versione base progetto : $fallback"
          Write-Host "Versione più alta nota: $highest"
          Write-Host "Nuova Release         : $version"

          $propertyGroup = $project.Project.PropertyGroup | Select-Object -First 1
          $propertyGroup.Version = $version
          if ($null -eq $propertyGroup.AssemblyVersion) {
            $node = $project.CreateElement('AssemblyVersion'); [void]$propertyGroup.AppendChild($node)
          }
          $propertyGroup.AssemblyVersion = "$version.0"
          if ($null -eq $propertyGroup.FileVersion) {
            $node = $project.CreateElement('FileVersion'); [void]$propertyGroup.AppendChild($node)
          }
          $propertyGroup.FileVersion = "$version.0"
          $project.Save((Resolve-Path '.\CppStudentClient.csproj'))


      - name: Setup MSYS2 UCRT64 con GCC C++17
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Prepara configurazione Google OAuth
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64)) {
            throw 'Secret GOOGLE_OAUTH_CLIENT_JSON_BASE64 non configurato nella repository.'
          }
          New-Item -ItemType Directory -Force -Path '.\Assets' | Out-Null
          try {
            $bytes = [Convert]::FromBase64String($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64.Trim())
          } catch {
            throw 'Il secret GOOGLE_OAUTH_CLIENT_JSON_BASE64 non contiene Base64 valido.'
          }
          [System.IO.File]::WriteAllBytes('.\Assets\google_oauth_client.json', $bytes)
          $oauth = Get-Content '.\Assets\google_oauth_client.json' -Raw | ConvertFrom-Json
          if (-not $oauth.installed.client_id) {
            throw 'JSON OAuth non valido: manca installed.client_id. Creare un client Google di tipo App desktop.'
          }
          Write-Host 'Configurazione OAuth Google ricreata e validata.'

      - name: Pubblica CV+ e copia fisicamente GCC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem . -Directory |
            Where-Object { $_.Name -like 'backup_*' -or $_.Name -like 'COMPILATORE_*' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Questa repository deve compilare esclusivamente il progetto Windows.
          Remove-Item .\CVPlus.Mac -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\macos -Recurse -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path .\CppStudentClient.csproj)) {
            throw 'CppStudentClient.csproj non trovato nella radice della repository.'
          }

          Remove-Item .\publish -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\publish\compiler\ucrt64 | Out-Null

          dotnet restore .\CppStudentClient.csproj
          dotnet publish .\CppStudentClient.csproj -c Release -r win-x64 --self-contained true -p:SelfContained=true -p:UseAppHost=true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:APP_VERSION -p:AssemblyVersion=$env:APP_VERSION.0 -p:FileVersion=$env:APP_VERSION.0 -o .\publish
          if (-not (Test-Path '.\publish\Assets\google_oauth_client.json')) {
            throw 'google_oauth_client.json non incluso nella cartella publish.'
          }

          # Verifica obbligatoria dell'eseguibile principale.
          # Una Release non deve essere creata se CppStudentClient.exe manca.
          $appExe = (Resolve-Path .\publish).Path | Join-Path -ChildPath 'CppStudentClient.exe'

          if (-not (Test-Path $appExe)) {
            Write-Host 'CppStudentClient.exe non trovato. Contenuto principale di publish:'
            Get-ChildItem .\publish -File |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize |
              Out-String |
              Write-Host

            # Recupero prudente: se dotnet ha prodotto un solo eseguibile
            # applicativo nella radice di publish con un nome diverso,
            # lo copia con il nome atteso dall'installer.
            $candidateApps = @(
              Get-ChildItem .\publish -File -Filter '*.exe' |
              Where-Object {
                $_.Name -notin @('test17.exe', 'g++.exe', 'gcc.exe')
              }
            )

            if ($candidateApps.Count -eq 1) {
              Write-Host "Eseguibile applicativo trovato con nome diverso: $($candidateApps[0].FullName)"
              Copy-Item $candidateApps[0].FullName $appExe -Force
            }
          }

          if (-not (Test-Path $appExe)) {
            throw 'CppStudentClient.exe non prodotto da dotnet publish. Release annullata.'
          }

          $appExeSize = (Get-Item $appExe).Length
          if ($appExeSize -lt 50KB) {
            throw "CppStudentClient.exe anormalmente piccolo: $appExeSize byte"
          }

          Write-Host "Applicazione prodotta correttamente: $appExe"
          Write-Host "Dimensione applicazione: $([math]::Round($appExeSize / 1KB, 1)) KB"

          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($msysRoot)) { throw 'setup-msys2 non ha restituito msys2-location' }

          $source = Join-Path $msysRoot 'ucrt64'
          $dest = (Resolve-Path .\publish\compiler\ucrt64).Path
          if (-not (Test-Path (Join-Path $source 'bin\g++.exe'))) {
            throw "g++.exe non trovato nel runner: $source\bin\g++.exe"
          }

          Write-Host "Copia fisica GCC da: $source"
          Write-Host "Copia fisica GCC a : $dest"
          & robocopy $source $dest /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NP
          $rc = $LASTEXITCODE
          if ($rc -gt 7) { throw "Robocopy GCC fallito con codice $rc" }

          $gpp = Join-Path $dest 'bin\g++.exe'
          $cc1 = Get-ChildItem $dest -Recurse -Filter cc1plus.exe -File | Select-Object -First 1
          if (-not (Test-Path $gpp)) { throw "g++.exe non copiato: $gpp" }
          if (-not $cc1) { throw 'cc1plus.exe non copiato' }
          if (-not (Test-Path (Join-Path $dest 'include\c++'))) { throw 'Header C++ non copiati' }
          if (-not (Test-Path (Join-Path $dest 'lib'))) { throw 'Librerie GCC non copiate' }

          $env:PATH = "$(Split-Path $gpp);$env:PATH"
          @(
            '#include <iostream>',
            'int main(){ std::cout << "C++17 OK"; return 0; }'
          ) | Set-Content .\test17.cpp -Encoding ascii
          & $gpp -std=c++17 .\test17.cpp -o .\test17.exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .\test17.exe)) {
            throw 'Test C++17 fallito prima del setup'
          }

          $size = (Get-ChildItem $dest -Recurse -File | Measure-Object Length -Sum).Sum
          if ($size -lt 100MB) {
            throw "Toolchain GCC incompleto: $([math]::Round($size/1MB,1)) MB"
          }

          "MSYS2 root: $msysRoot" | Set-Content .\publish\compiler_manifest.txt
          "Toolchain bytes: $size" | Add-Content .\publish\compiler_manifest.txt
          "g++: $gpp" | Add-Content .\publish\compiler_manifest.txt
          Get-ChildItem $dest -Recurse -File | ForEach-Object FullName | Set-Content .\publish\compiler_file_list.txt

      - name: Installa Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Crea installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe non trovato' }


          $appExe = '.\publish\CppStudentClient.exe'
          if (-not (Test-Path $appExe)) {
            Write-Host 'File presenti nella radice di publish:'
            Get-ChildItem .\publish -File |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize |
              Out-String |
              Write-Host
            throw 'CppStudentClient.exe assente da publish prima di Inno Setup'
          }

          if (-not (Test-Path .\publish\compiler\ucrt64\bin\g++.exe)) {
            throw 'g++.exe assente da publish prima di Inno Setup'
          }

          & $iscc "/DMyAppVersion=$env:APP_VERSION" .\setup_student.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compilazione Inno Setup fallita' }

          $setup = '.\installer\CppStudentClient_Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer non creato' }
          $setupSize = (Get-Item $setup).Length
          if ($setupSize -lt 40MB) {
            throw "Installer anormalmente piccolo: $([math]::Round($setupSize/1MB,1)) MB. GCC non incluso."
          }

      - name: Verifica realmente l'installer prodotto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path $env:RUNNER_TEMP 'cvplus_verify'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $verify | Out-Null

          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$verify")
          $p = Start-Process .\installer\CppStudentClient_Setup.exe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installazione di verifica fallita: exit code $($p.ExitCode)" }

          $installedApp = Join-Path $verify 'CppStudentClient.exe'
          if (-not (Test-Path $installedApp)) {
            Write-Host 'File installati nella cartella di verifica:'
            Get-ChildItem $verify -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            throw "CppStudentClient.exe assente dopo installazione: $installedApp"
          }

          $installedAppSize = (Get-Item $installedApp).Length
          if ($installedAppSize -lt 50KB) {
            throw "CppStudentClient.exe installato ma anormalmente piccolo: $installedAppSize byte"
          }

          Write-Host "Eseguibile applicazione verificato dopo installazione: $installedApp"

          $installedOAuth = Join-Path $verify 'Assets\google_oauth_client.json'
          if (-not (Test-Path $installedOAuth)) {
            throw "Configurazione Google OAuth assente dopo installazione: $installedOAuth"
          }
          Write-Host "Configurazione Google OAuth verificata dopo installazione."

          $gpp = Join-Path $verify 'compiler\ucrt64\bin\g++.exe'
          if (-not (Test-Path $gpp)) { throw "g++.exe assente dopo installazione: $gpp" }

          $env:PATH = "$(Split-Path $gpp);$env:PATH"
          @(
            '#include <iostream>',
            'int main(){ std::cout << "INSTALLER C++17 OK"; return 0; }'
          ) | Set-Content (Join-Path $verify 'verify.cpp') -Encoding ascii

          & $gpp -std=c++17 (Join-Path $verify 'verify.cpp') -o (Join-Path $verify 'verify.exe')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $verify 'verify.exe'))) {
            throw 'Test C++17 dopo installazione fallito'
          }

      - name: Pubblica setup come artifact
        uses: actions/upload-artifact@v4
        with:
          name: CVPlus-Windows-Setup
          path: installer/CppStudentClient_Setup.exe
          if-no-files-found: error

      - name: Crea GitHub Release e verifica asset aggiornamento
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "compilatore-alunni-v$env:APP_VERSION"
          $setup = '.\installer\CppStudentClient_Setup.exe'
          if (-not (Test-Path $setup)) { throw 'CppStudentClient_Setup.exe non trovato prima della Release.' }

          # Se per qualche motivo esiste già una Release con lo stesso tag, aggiorna gli asset
          # invece di lasciare il repository in uno stato senza installer utilizzabile.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag già esistente: sostituisco gli asset."
            gh release upload $tag $setup .\publish\compiler_manifest.txt .\publish\compiler_file_list.txt --clobber
          } else {
            gh release create $tag $setup .\publish\compiler_manifest.txt .\publish\compiler_file_list.txt `
              --title "CV+ Compilatore Alunno $env:APP_VERSION" `
              --notes "Aggiornamento automatico CV+ $env:APP_VERSION. Installer verificato: applicazione, GCC e risorse presenti dopo installazione.`nCommit: ${{ github.sha }}`nBranch: ${{ github.ref_name }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "Creazione/aggiornamento Release $tag fallita." }

          $latest = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
          if ([string]$latest.tag_name -ne $tag) {
            throw "La Release latest non corrisponde a quella appena creata. Attesa=$tag Trovata=$($latest.tag_name)"
          }
          $assetNames = @($latest.assets | ForEach-Object { [string]$_.name })
          if ($assetNames -notcontains 'CppStudentClient_Setup.exe') {
            throw 'Release creata ma CppStudentClient_Setup.exe non risulta tra gli asset.'
          }
          Write-Host "Release pubblica verificata: $tag con CppStudentClient_Setup.exe"

